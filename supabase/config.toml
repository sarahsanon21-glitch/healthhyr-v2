# Local Supabase for HealthHyr v2.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Only the database and Auth run locally for now, plus a mail catcher so emailed codes can be read
# in tests. Turn on [storage] (resume uploads), [api] and [studio] when a later step needs them.
# They pull extra Docker images when enabled.
# Local keys are printed by `npm run db:status`. Keep them in git-ignored .env files only.

project_id = "healthhyr-v2"

[api]
enabled = false
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

# No seed data: HealthHyr never ships fake records.
[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 54323

# The mail catcher (Mailpit). Every email Auth sends lands here instead of the internet.
# Inbox: http://127.0.0.1:54324. Tests read emailed codes from its API.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Same as production must be: nobody gets an account for an address they cannot read.
enable_confirmations = true
max_frequency = "1s"
# Emailed codes: 6 digits, valid for 15 minutes.
otp_length = 6
otp_expiry = 900

# The emails show a 6-digit code, not a link, so the same flow works on the website and in the app.
[auth.email.template.confirmation]
subject = "Your HealthHyr confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your HealthHyr password reset code"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
