# Local Supabase for HealthHyr v2.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Only the database and Auth run locally for now: the RLS tests need the real auth schema and
# roles, and nothing else. Turn on [storage] (resume uploads), [api] and [studio] when a later
# step needs them. They pull extra Docker images when enabled.
# Local keys are printed by `npm run db:status`. Keep them in git-ignored .env files only.

project_id = "healthhyr-v2"

[api]
enabled = false
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

# No seed data: HealthHyr never ships fake records.
[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
